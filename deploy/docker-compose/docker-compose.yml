services:
  openbao:
    image: openbao/openbao:2.2.0
    command: server -config=/openbao/config/openbao.hcl
    ports:
      - "8200:8200"
    cap_add: ["IPC_LOCK"]
    volumes:
      - ../openbao/config:/openbao/config:ro
      - openbao-data:/openbao/data
  bootstrap:
    image: curlimages/curl:8.12.1
    depends_on: [openbao]
    volumes:
      - ../openbao/bootstrap:/bootstrap:ro
    entrypoint: ["/bin/sh", "/bootstrap/userpass.sh"]
volumes:
  openbao-data:
